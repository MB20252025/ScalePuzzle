<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚖️ Real Balance · Modular</title>
    <style>
        /* ---------- global ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background: #b8a48b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .game-container {
            max-width: 440px;
            width: 100%;
            background: #f7efe0;
            border-radius: 44px 44px 32px 32px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.45), inset 0 0 0 4px #e7d7be;
            padding: 20px 14px 24px;
            border: 6px solid #b3956a;
        }
        h1 {
            text-align: center;
            font-weight: 800;
            color: #3d2b1b;
            font-size: 2.1rem;
            text-shadow: 3px 3px 0 #dcc9ac;
        }
        .sub {
            text-align: center;
            color: #5f4431;
            font-size: 0.85rem;
            margin-bottom: 10px;
            font-style: italic;
        }

        /* ---------- scale stage ---------- */
        .scale-stage {
            position: relative;
            height: 320px;
            margin: 6px 0 8px;
            background: radial-gradient(ellipse at 50% 100%, #cab99f, #b8a080);
            border-radius: 60px 60px 24px 24px;
            border: 3px solid #a88864;
            overflow: hidden;
        }
        .scale-holder {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* ---- all parts are positioned absolutely ---- */
        .part {
            position: absolute;
            pointer-events: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* ----- COLUMN (static) ----- */
        #columnPart {
            background-image: url('assets/column.png');
            z-index: 1;
            /* size, left, top set by JS */;
        }

        /* ----- BEAM (rotating) ----- */
        #beamPart {
            background-image: url('assets/beam.png');
            z-index: 5;
            transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
            /* size, left, top, transform-origin set by JS */;
        }

        /* ----- PAN + STRING (movable) ----- */
        .pan-string {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            z-index: 20;
            background-image: url('assets/panstring.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 18px;
            transition: transform 0.15s;
            /* size, left, top set by JS */;
        }
        .pan-string:active {
            transform: scale(0.97);
        }
        .pan-string.bounce {
            animation: panBounce 0.2s ease-out;
        }
        @keyframes panBounce {
            0% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.08);
            }
            70% {
                transform: scale(0.96);
            }
            100% {
                transform: scale(1);
            }
        }

        /* weights container inside pan */
        .weights-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            pointer-events: none;
            gap: 2px;
            padding-bottom: 4px;
        }
        .bottom-row,
        .top-row {
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-wrap: nowrap;
            width: 100%;
        }

        /* weight badges (interactive) */
        .weight-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: radial-gradient(circle at 35% 30%, #f7eed8, #c9b084);
            border: 3px solid #4a3729;
            box-shadow: 0 4px 0 #6b4f36, 0 3px 8px rgba(0, 0, 0, 0.35);
            font-size: 1.6rem;
            font-weight: 700;
            color: #2c1f13;
            border-radius: 6px;
            cursor: pointer;
            pointer-events: auto;
            flex-shrink: 0;
            text-shadow: 1px 1px 0 rgba(255, 255, 200, 0.5);
            transition: transform 0.08s;
        }
        .weight-badge:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #6b4f36;
        }
        .weight-badge[data-type="2"],
        .weight-badge[data-type="5"] {
            background: radial-gradient(circle at 35% 30%, #fcf3db, #d4b68a);
            font-size: 1.8rem;
        }

        /* ----- tray & controls ----- */
        .tray-label {
            font-size: 1rem;
            color: #3d2b1b;
            margin: 8px 0 4px;
            font-weight: 700;
            text-align: center;
        }
        .tray {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 4px 0 10px;
            padding: 10px 8px;
            background: #dcc9ae;
            border-radius: 60px;
            border: 3px solid #ab8b66;
        }
        .tray-item {
            width: 56px;
            height: 56px;
            background: radial-gradient(circle at 40% 35%, #fcf3df, #d6be9a);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.0rem;
            font-weight: 700;
            border: 4px solid #8b6d4b;
            box-shadow: 0 5px 0 #5a432e, 0 3px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            color: #2c1f13;
            text-shadow: 1px 1px 0 rgba(255, 255, 200, 0.4);
            transition: all 0.12s ease;
        }
        .tray-item.selected {
            border: 6px solid #f5c542;
            box-shadow: 0 0 0 3px #ffd966, 0 5px 0 #8b6d4b;
            transform: scale(1.06);
            background: #fff3d1;
        }
        .tray-item.used {
            opacity: 0.35;
            filter: grayscale(0.8);
            pointer-events: none;
            border-color: #6a5a4a;
            box-shadow: 0 3px 0 #5a432e;
        }
        .tray-item:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #5a432e;
        }
        .tray-item[data-type="2"],
        .tray-item[data-type="5"] {
            font-size: 2.2rem;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 4px 0 10px;
        }
        .reset-btn {
            background: #b1865b;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            padding: 8px 34px;
            border-radius: 40px;
            font-weight: 700;
            box-shadow: 0 5px 0 #5f4230, 0 4px 12px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            border: 2px solid #e9c894;
            transition: transform 0.06s;
        }
        .reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #5f4230;
        }

        .guess-panel {
            background: #e7d6bb;
            border-radius: 44px;
            padding: 16px 10px 14px;
            border: 3px solid #b08d66;
            margin-top: 4px;
        }
        .guess-title {
            text-align: center;
            font-size: 1.0rem;
            font-weight: 700;
            color: #2e1f13;
            margin-bottom: 8px;
        }
        .guess-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .guess-item {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #fcf2dd;
            padding: 3px 12px 3px 8px;
            border-radius: 30px;
            border: 2px solid #957859;
            font-size: 1.4rem;
            font-weight: 600;
        }
        .guess-item label {
            font-size: 1.5rem;
        }
        .guess-item input {
            width: 48px;
            padding: 4px 2px;
            font-size: 1.2rem;
            text-align: center;
            border: 2px solid #b39264;
            border-radius: 20px;
            background: #fffcf0;
            font-weight: 700;
            outline: none;
        }
        .guess-item input:focus {
            border-color: #8b6d4b;
            box-shadow: 0 0 0 3px rgba(139, 109, 75, 0.3);
        }
        .check-btn {
            background: #5f7b6e;
            border: none;
            color: #fff;
            font-size: 1.4rem;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 700;
            box-shadow: 0 4px 0 #2f4a3f, 0 3px 10px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            border: 2px solid #bdd3c0;
        }
        .check-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #2f4a3f;
        }
        .message {
            text-align: center;
            font-size: 1.2rem;
            min-height: 2.4rem;
            color: #2f4d3a;
            margin: 8px 0 2px;
            padding: 6px 10px;
            background: #f4e9d8;
            border-radius: 40px;
            border: 2px solid #bda37e;
            font-weight: 600;
        }

        /* responsive */
        @media (max-width: 420px) {
            .scale-stage {
                height: 270px;
            }
            .weight-badge {
                width: 32px;
                height: 32px;
                font-size: 1.3rem;
            }
            .tray-item {
                width: 46px;
                height: 46px;
                font-size: 1.6rem;
            }
            .guess-item input {
                width: 40px;
                font-size: 1.0rem;
            }
            h1 {
                font-size: 1.6rem;
            }
            .reset-btn {
                font-size: 1.0rem;
                padding: 6px 24px;
            }
            .check-btn {
                font-size: 1.1rem;
                padding: 5px 14px;
            }
        }
        @media (max-width: 360px) {
            .scale-stage {
                height: 220px;
            }
            .weight-badge {
                width: 28px;
                height: 28px;
                font-size: 1.0rem;
            }
            .tray-item {
                width: 38px;
                height: 38px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>⚖️ REAL BALANCE</h1>
        <div class="sub">select a weight → tap a pan · tap badge to remove</div>

        <!-- scale stage -->
        <div class="scale-stage">
            <div class="scale-holder" id="scaleHolder">

                <!-- COLUMN (static) -->
                <div id="columnPart" class="part"></div>

                <!-- BEAM (rotating) -->
                <div id="beamPart" class="part"></div>

                <!-- LEFT PAN + STRING -->
                <div class="pan-string left-pan" id="leftPan">
                    <div class="weights-container" id="leftWeights">
                        <div class="top-row" id="leftTopRow"></div>
                        <div class="bottom-row" id="leftBottomRow"></div>
                    </div>
                </div>

                <!-- RIGHT PAN + STRING -->
                <div class="pan-string right-pan" id="rightPan">
                    <div class="weights-container" id="rightWeights">
                        <div class="top-row" id="rightTopRow"></div>
                        <div class="bottom-row" id="rightBottomRow"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- tray -->
        <div class="tray-label">▼ select a weight (one each) ▼</div>
        <div class="tray" id="tray">
            <div class="tray-item" data-type="2">2</div>
            <div class="tray-item" data-type="5">5</div>
            <div class="tray-item" data-type="star">⭐</div>
            <div class="tray-item" data-type="triangle">🔺</div>
            <div class="tray-item" data-type="circle">⚫</div>
        </div>

        <div class="action-row">
            <button class="reset-btn" id="resetBtn">⟲ reset</button>
        </div>

        <!-- guess panel -->
        <div class="guess-panel">
            <div class="guess-title">🔍 deduce hidden values</div>
            <div class="guess-row">
                <div class="guess-item"><label>⭐</label><input type="number" id="starGuess" placeholder="?" /></div>
                <div class="guess-item"><label>🔺</label><input type="number" id="triangleGuess" placeholder="?" /></div>
                <div class="guess-item"><label>⚫</label><input type="number" id="circleGuess" placeholder="?" /></div>
                <button class="check-btn" id="checkBtn">✔ check</button>
            </div>
            <div class="message" id="messageDisplay"></div>
        </div>
    </div>

    <script>
        (function() {
            // ================================================================
            //  INDIVIDUAL OFFSET & SCALE CONTROLS FOR EACH ASSET
            //  - x, y: move left/right/up/down (positive = right/down)
            //  - scale: multiplier for the base size (1 = original)
            //  - You can also override width/height directly by adding them
            // ================================================================
            const OFFSETS = {
                column: {
                    x: 0,     // horizontal offset (px)
                    y: 0,     // vertical offset (px)
                    scale: 1, // size multiplier
                },
                beam: {
                    x: 0,
                    y: 0,
                    scale: 1,
                },
                leftPan: {
                    x: 0,
                    y: 0,
                    scale: 1,
                },
                rightPan: {
                    x: 0,
                    y: 0,
                    scale: 1,
                },
            };

            // ================================================================
            //  BASE DIMENSIONS (adjust to match your image files)
            //  These are the pixel sizes of your original images.
            // ================================================================
            const CONFIG = {
                // Column
                columnWidth: 48,
                columnHeight: 260,
                // Beam
                beamWidth: 320,    // full width of beam image
                beamHeight: 28,    // height of beam image
                beamHalf: 138,     // half of beamWidth (used for rotation pivot)
                // Pan + string
                panWidth: 130,     // width of panstring.png
                panHeight: 160,    // height of panstring.png
                // Stage
                containerWidth: 380,
                containerHeight: 320,
                pivotY: 50,        // vertical position of pivot from top of stage
                // Internal (calculated)
                pivotX: 190,       // will be set to half of container width
            };

            // ---------- DOM refs ----------
            const beamEl = document.getElementById('beamPart');
            const columnEl = document.getElementById('columnPart');
            const leftPan = document.getElementById('leftPan');
            const rightPan = document.getElementById('rightPan');
            const leftTopRow = document.getElementById('leftTopRow');
            const leftBottomRow = document.getElementById('leftBottomRow');
            const rightTopRow = document.getElementById('rightTopRow');
            const rightBottomRow = document.getElementById('rightBottomRow');
            const trayItems = document.querySelectorAll('.tray-item');
            const resetBtn = document.getElementById('resetBtn');
            const starInp = document.getElementById('starGuess');
            const triangleInp = document.getElementById('triangleGuess');
            const circleInp = document.getElementById('circleGuess');
            const checkBtn = document.getElementById('checkBtn');
            const msg = document.getElementById('messageDisplay');

            // ---------- game state ----------
            const SECRET = { star: 2, triangle: 4, circle: 6 };
            let leftSet = new Set();
            let rightSet = new Set();
            let selectedType = null;

            // ---------- helpers ----------
            function getValue(type) {
                if (type === '2') return 2;
                if (type === '5') return 5;
                if (type === 'star') return SECRET.star;
                if (type === 'triangle') return SECRET.triangle;
                if (type === 'circle') return SECRET.circle;
                return 0;
            }

            function getChar(type) {
                if (type === '2') return '2';
                if (type === '5') return '5';
                if (type === 'star') return '⭐';
                if (type === 'triangle') return '🔺';
                if (type === 'circle') return '⚫';
                return '?';
            }

            function splitPyramid(items) {
                let arr = Array.from(items);
                let total = arr.length;
                if (total <= 2) return { bottom: arr, top: [] };
                if (total === 3) return { bottom: arr.slice(0, 2), top: arr.slice(2) };
                if (total === 4) return { bottom: arr.slice(0, 2), top: arr.slice(2) };
                return { bottom: arr.slice(0, 3), top: arr.slice(3) };
            }

            function computeTotals() {
                let leftTotal = 0,
                    rightTotal = 0;
                for (let t of leftSet) leftTotal += getValue(t);
                for (let t of rightSet) rightTotal += getValue(t);
                return { leftTotal, rightTotal };
            }

            // ---------- render weights ----------
            function renderWeights() {
                let leftSplit = splitPyramid(leftSet);
                leftBottomRow.innerHTML = '';
                leftTopRow.innerHTML = '';
                leftSplit.bottom.forEach(type => leftBottomRow.appendChild(createWeightBadge(type, 'left')));
                leftSplit.top.forEach(type => leftTopRow.appendChild(createWeightBadge(type, 'left')));

                let rightSplit = splitPyramid(rightSet);
                rightBottomRow.innerHTML = '';
                rightTopRow.innerHTML = '';
                rightSplit.bottom.forEach(type => rightBottomRow.appendChild(createWeightBadge(type, 'right')));
                rightSplit.top.forEach(type => rightTopRow.appendChild(createWeightBadge(type, 'right')));
            }

            function createWeightBadge(type, side) {
                let b = document.createElement('span');
                b.className = 'weight-badge';
                b.textContent = getChar(type);
                b.dataset.type = type;
                b.dataset.side = side;
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (selectedType !== null) {
                        addToSide(side);
                    } else {
                        removeWeight(side, type);
                    }
                });
                return b;
            }

            function removeWeight(side, type) {
                if (side === 'left') leftSet.delete(type);
                else rightSet.delete(type);
                if (selectedType === type) selectedType = null;
                renderAll();
            }

            // ---------- positioning ----------
            function updatePositions(angle) {
                const {
                    columnWidth, columnHeight,
                    beamWidth, beamHeight, beamHalf,
                    panWidth, panHeight,
                    containerWidth, containerHeight,
                    pivotY
                } = CONFIG;

                // Extract offsets & scales
                const { column, beam, leftPan: leftPanOff, rightPan: rightPanOff } = OFFSETS;

                // --- COLUMN ---
                const colW = columnWidth * column.scale;
                const colH = columnHeight * column.scale;
                columnEl.style.width = colW + 'px';
                columnEl.style.height = colH + 'px';
                columnEl.style.left = `calc(50% - ${colW/2}px + ${column.x}px)`;
                columnEl.style.top = `calc(10px + ${column.y}px)`;

                // --- BEAM ---
                const beamW = beamWidth * beam.scale;
                const beamH = beamHeight * beam.scale;
                const halfW = beamW / 2;
                // The pivot point is at (pivotX, pivotY) relative to container.
                // We position the beam so its center is at the pivot, plus offsets.
                const pivotX = containerWidth / 2;
                const beamLeft = pivotX - halfW + beam.x;
                const beamTop = pivotY - beamH / 2 + beam.y;
                beamEl.style.width = beamW + 'px';
                beamEl.style.height = beamH + 'px';
                beamEl.style.left = beamLeft + 'px';
                beamEl.style.top = beamTop + 'px';
                // The transform-origin must be at the center of the beam (which is the pivot)
                // but since we moved the beam to center on pivot, the origin is at (halfW, beamH/2)
                beamEl.style.transformOrigin = `${halfW}px ${beamH/2}px`;
                beamEl.style.transform = `rotate(${angle}deg)`;

                // --- PANS ---
                // Calculate beam end points (using the scaled halfW)
                const rad = angle * Math.PI / 180;
                const cos = Math.cos(rad);
                const sin = Math.sin(rad);
                // The beam's pivot is at (pivotX, pivotY)
                // but we added beam offset; however the beam's center is at (pivotX + beam.x, pivotY + beam.y)
                // For string attachment, we use the beam ends from the pivot (ignoring beam offset for simplicity? 
                // Actually we should use the actual beam ends after offset. The beam offset shifts the whole beam, so the ends shift too.
                // So we compute ends from the beam's center (pivotX + beam.x, pivotY + beam.y)
                const beamCenterX = pivotX + beam.x;
                const beamCenterY = pivotY + beam.y;
                let leftEndX = beamCenterX - halfW * cos;
                let leftEndY = beamCenterY - halfW * sin;
                let rightEndX = beamCenterX + halfW * cos;
                let rightEndY = beamCenterY + halfW * sin;

                // String length (approx vertical distance from beam end to pan top)
                const stringLen = 70; // fixed for now, could also scale with pan scale

                // Left pan
                const panScale = leftPanOff.scale;
                const panW = panWidth * panScale;
                const panH = panHeight * panScale;
                // Position pan so that its top-center is at the string attachment point
                let leftPanX = leftEndX + leftPanOff.x;
                let leftPanY = leftEndY + stringLen + leftPanOff.y;
                // Clamp to container
                leftPanX = Math.max(panW/2, Math.min(containerWidth - panW/2, leftPanX));
                leftPanY = Math.max(panH/2, Math.min(containerHeight - panH/2, leftPanY));
                leftPan.style.width = panW + 'px';
                leftPan.style.height = panH + 'px';
                leftPan.style.left = (leftPanX - panW/2) + 'px';
                leftPan.style.top = (leftPanY - panH/2) + 'px';

                // Right pan
                const panScaleR = rightPanOff.scale;
                const panWR = panWidth * panScaleR;
                const panHR = panHeight * panScaleR;
                let rightPanX = rightEndX + rightPanOff.x;
                let rightPanY = rightEndY + stringLen + rightPanOff.y;
                rightPanX = Math.max(panWR/2, Math.min(containerWidth - panWR/2, rightPanX));
                rightPanY = Math.max(panHR/2, Math.min(containerHeight - panHR/2, rightPanY));
                rightPan.style.width = panWR + 'px';
                rightPan.style.height = panHR + 'px';
                rightPan.style.left = (rightPanX - panWR/2) + 'px';
                rightPan.style.top = (rightPanY - panHR/2) + 'px';
            }

            // ---------- main render ----------
            function renderAll() {
                renderWeights();
                let { leftTotal, rightTotal } = computeTotals();
                let diff = leftTotal - rightTotal;
                let angle = Math.min(18, Math.max(-18, -diff * 0.8));
                updatePositions(angle);

                trayItems.forEach(item => {
                    let t = item.dataset.type;
                    item.classList.toggle('used', leftSet.has(t) || rightSet.has(t));
                    item.classList.toggle('selected', t === selectedType && !leftSet.has(t) && !rightSet.has(t));
                });
            }

            // ---------- add weight ----------
            function addToSide(side) {
                if (!selectedType) {
                    msg.textContent = '⚡ select a weight first';
                    setTimeout(() => { if (msg.textContent === '⚡ select a weight first') msg.textContent = ''; }, 700);
                    return;
                }
                if (leftSet.has(selectedType) || rightSet.has(selectedType)) {
                    msg.textContent = '⛔ already used (tap badge to remove)';
                    setTimeout(() => { if (msg.textContent === '⛔ already used (tap badge to remove)') msg.textContent = ''; },
                    1000);
                    return;
                }
                if (side === 'left') leftSet.add(selectedType);
                else rightSet.add(selectedType);
                selectedType = null;
                renderAll();

                let pan = side === 'left' ? leftPan : rightPan;
                pan.classList.add('bounce');
                setTimeout(() => pan.classList.remove('bounce'), 200);
                msg.textContent = '';
            }

            // ---------- reset ----------
            function resetAll() {
                leftSet.clear();
                rightSet.clear();
                selectedType = null;
                renderAll();
                msg.textContent = '';
            }

            // ---------- event binding ----------
            trayItems.forEach(item => {
                item.addEventListener('click', () => {
                    let t = item.dataset.type;
                    if (leftSet.has(t) || rightSet.has(t)) {
                        msg.textContent = '⛔ already on scale (tap badge to remove)';
                        setTimeout(() => { if (msg.textContent === '⛔ already on scale (tap badge to remove)') msg
                                .textContent = ''; }, 700);
                        return;
                    }
                    selectedType = (selectedType === t) ? null : t;
                    renderAll();
                    msg.textContent = selectedType ? `selected ${getChar(selectedType)}` : 'no selection';
                    setTimeout(() => { if (msg.textContent.includes('selected') || msg.textContent === 'no selection')
                            msg.textContent = ''; }, 700);
                });
            });

            leftPan.addEventListener('click', () => addToSide('left'));
            rightPan.addEventListener('click', () => addToSide('right'));
            resetBtn.addEventListener('click', resetAll);

            checkBtn.addEventListener('click', () => {
                let s = parseInt(starInp.value, 10);
                let t = parseInt(triangleInp.value, 10);
                let c = parseInt(circleInp.value, 10);
                if (isNaN(s) || isNaN(t) || isNaN(c)) {
                    msg.textContent = '❌ enter numbers';
                    return;
                }
                if (s === SECRET.star && t === SECRET.triangle && c === SECRET.circle) {
                    msg.textContent = '✅ Puzzle solved!';
                } else {
                    msg.textContent = '❌ Not quite. Try again.';
                }
            });

            // ---------- init ----------
            function init() {
                const container = document.getElementById('scaleHolder');
                const rect = container.getBoundingClientRect();
                CONFIG.containerWidth = rect.width;
                CONFIG.containerHeight = rect.height;
                CONFIG.pivotX = rect.width / 2;
                renderAll();
            }

            window.addEventListener('load', init);
            window.addEventListener('resize', init);
            setTimeout(init, 100);
        })();
    </script>
</body>
</html>
