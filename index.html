<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚖️ Real Balance</title>
<style>
    /* =========================================================
       ★★★ ALL CONTROLS — EDIT THESE ★★★
       ========================================================= */
    :root {
        /* ----- COG LAYERS (only editable layers) ----- */
        --layer-cogback:  1;
        --layer-cog1:     2;
        --layer-cog2:     3;
        --layer-cog3:     4;

        /* ----- DRAWER ----- */
        --drawer-top:        -300px;
        --drawer-shift-x:    0px;
        --drawer-close-scale: 0.403;
        --drawer-open-scale:  0.48;
        --drawer-open-top:     0px;
        --drawer-open-shift-x: 0px;

        /* ----- SCALE ----- */
        --scale-top:         0px;
        --scale-shift-x:     0px;

        /* ----- COG STAGE ----- */
        --cog-stage-top:    0px;
        --cog-stage-bottom: 0px;
        --cog-stage-height: 80px;    /* smaller so the page fits */

        --cogback-x:     -300px;
        --cogback-y:     -500px;
        --cogback-scale: 0.075;

        --cog1-x:     0px;
        --cog1-y:     0px;
        --cog1-scale: 0.30;
        --cog1-spin:  8s;

        --cog2-x:     0px;
        --cog2-y:     0px;
        --cog2-scale: 0.25;
        --cog2-spin:  6s;

        --cog3-x:     0px;
        --cog3-y:     0px;
        --cog3-scale: 0.20;
        --cog3-spin:  10s;

        /* ----- colours ----- */
        --bg:        #0a0d16;
        --text:      #e8ecf5;
        --muted:     #8892ab;
        --gold:      #f0b429;
        --gold-hi:   #ffd066;
        --gold-lo:   #d99a1a;
        --green:     #34d399;
        --red:       #f87171;
        --line:      rgba(255,255,255,0.08);
    }

    /* =========================================================
       LOCK THE PAGE — no scrolling
       ========================================================= */
    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        height: 100vh;
        height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                     'Helvetica Neue', Arial, sans-serif;
        color: var(--text);
        background: #0a0d16 url('assets/background.png') center / cover no-repeat fixed;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
    }

    /* flex column fills the viewport exactly */
    .game-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    /* =========================================================
       FIXED LAYERS (not editable):
         header 20 · scale 30 · ui-body 40 · pans 45 · drawer 50
       Cogs at 1–4 always sit underneath.
       ========================================================= */

    /* ---------------- header ---------------- */
    .ui-header {
        flex: 0 0 auto;
        position: relative;
        z-index: 20;
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
        padding: 14px 20px 6px;
        text-align: center;
    }

    h1 {
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        line-height: 1.2;
        color: #eef2fb;
    }

    .balance-word {
        display: inline-block;
        transform-origin: center center;
        color: var(--gold);
        animation: wobbleBalance 2.8s ease-in-out 1 forwards;
    }

    @keyframes wobbleBalance {
        0%   { transform: rotate(0deg)     scale(1);    }
        8%   { transform: rotate(-4.5deg)  scale(1.04); }
        18%  { transform: rotate(5deg)     scale(0.97); }
        30%  { transform: rotate(-3deg)    scale(1.02); }
        42%  { transform: rotate(2deg)     scale(1);    }
        58%  { transform: rotate(-1.2deg)  scale(1);    }
        75%  { transform: rotate(0.5deg)   scale(1);    }
        100% { transform: rotate(0deg)     scale(1);    }
    }

    .sub {
        margin-top: 4px;
        font-size: 0.7rem;
        line-height: 1.4;
        color: var(--muted);
        letter-spacing: 0.02em;
    }

    /* ---------------- scale section (flexible) ---------------- */
    .scale-section {
        flex: 1 1 auto;
        min-height: 0;
        position: relative;
        z-index: 30;
        width: 100%;
        overflow: hidden;
        margin-top: var(--scale-top);
        transform: translateX(var(--scale-shift-x));
    }

    .scale-holder {
        position: relative;
        width: 100%;
        height: 100%;
    }

    .part {
        position: absolute;
        pointer-events: none;
        background-repeat: no-repeat;
        background-position: center;
    }

    #columnPart {
        background-image: url('assets/column.png');
        background-size: 100% 100%;
        background-position: center bottom;
        z-index: 2;
    }

    #beamPart {
        background-image: url('assets/beam.png');
        background-size: 100% 100%;
        z-index: 5;
        transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        filter: drop-shadow(0 6px 10px rgba(0,0,0,0.55));
    }

    #dialLayer {
        position: absolute;
        z-index: 1;
        pointer-events: none;
    }

    .dial {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        padding: 0;
        line-height: 1;
        font-family: inherit;
        font-weight: 800;
        color: #ffffff;
        cursor: pointer;
        pointer-events: auto;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255,255,255,0.22);
        background: #1a2238 url('assets/backgrounddial.jpg') center / cover no-repeat;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow:
            0 6px 16px rgba(0,0,0,0.55),
            0 0 0 1px rgba(0,0,0,0.35),
            inset 0 1px 0 rgba(255,255,255,0.30);
        text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.06s;
        touch-action: manipulation;
    }

    .dial:hover,
    .dial:focus-visible {
        border-color: rgba(240,180,41,0.85);
        box-shadow:
            0 6px 18px rgba(0,0,0,0.6),
            0 0 0 3px rgba(240,180,41,0.28),
            inset 0 1px 0 rgba(255,255,255,0.35);
        outline: none;
    }

    .dial:active { transform: translate(-50%, -50%) scale(0.92); }

    .dial.solved {
        border-color: var(--green);
        color: #d6ffee;
        box-shadow:
            0 0 0 3px rgba(52,211,153,0.28),
            0 6px 22px rgba(52,211,153,0.45),
            inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .dial.pop { animation: dialPop 0.22s ease-out; }

    @keyframes dialPop {
        0%   { transform: translate(-50%, -50%) scale(1);    }
        45%  { transform: translate(-50%, -50%) scale(1.18); }
        100% { transform: translate(-50%, -50%) scale(1);    }
    }

    .pan-string {
        position: absolute;
        z-index: 45;
        pointer-events: auto;
        cursor: pointer;
        background-image: url('assets/panstring.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 18px;
        filter: drop-shadow(0 10px 14px rgba(0,0,0,0.45));
        transition: filter 0.15s;
    }

    .pan-string:active { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5)); }
    .pan-string.bounce { animation: panBounce 0.2s ease-out; }

    @keyframes panBounce {
        0%   { transform: scale(1);    }
        30%  { transform: scale(1.08); }
        70%  { transform: scale(0.96); }
        100% { transform: scale(1);    }
    }

    .weights-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        width: 100%;
        gap: 3px;
        padding-bottom: 4px;
        pointer-events: none;
    }

    .bottom-row,
    .top-row {
        display: flex;
        justify-content: center;
        gap: 5px;
        flex-wrap: nowrap;
        width: 100%;
    }

    .weight-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        flex-shrink: 0;
        cursor: pointer;
        pointer-events: auto;
        background: transparent;
        border: none;
        filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6));
        transition: filter 0.08s, transform 0.08s;
    }

    .weight-badge img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .weight-badge:hover { filter: drop-shadow(0 0 8px rgba(240,180,41,0.85)); }
    .weight-badge:active {
        transform: translateY(2px) scale(0.95);
        filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
    }

    /* ---------------- cog stage (small fixed block) ---------------- */
    .cog-stage {
        flex: 0 0 auto;
        position: relative;
        z-index: 1;
        width: 100%;
        height: var(--cog-stage-height);
        margin-top: var(--cog-stage-top);
        margin-bottom: var(--cog-stage-bottom);
        pointer-events: none;
        overflow: visible;
    }

    .cog-holder {
        position: absolute;
        left: 50%;
        top: 50%;
        pointer-events: none;
    }

    .cog-holder img {
        display: block;
        width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
    }

    .cog-spin {
        animation-name: cogSpin;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
    }

    @keyframes cogSpin {
        from { transform: rotate(0deg);   }
        to   { transform: rotate(360deg); }
    }

    #cogBackHolder {
        width: calc(100% * var(--cogback-scale));
        transform: translate(-50%, -50%) translate(var(--cogback-x), var(--cogback-y));
        z-index: var(--layer-cogback);
    }

    #cog1Holder {
        width: calc(100% * var(--cog1-scale));
        transform: translate(-50%, -50%) translate(var(--cog1-x), var(--cog1-y));
        z-index: var(--layer-cog1);
    }
    #cog1Holder .cog-spin { animation-duration: var(--cog1-spin); }

    #cog2Holder {
        width: calc(100% * var(--cog2-scale));
        transform: translate(-50%, -50%) translate(var(--cog2-x), var(--cog2-y));
        z-index: var(--layer-cog2);
    }
    #cog2Holder .cog-spin { animation-duration: var(--cog2-spin); }

    #cog3Holder {
        width: calc(100% * var(--cog3-scale));
        transform: translate(-50%, -50%) translate(var(--cog3-x), var(--cog3-y));
        z-index: var(--layer-cog3);
    }
    #cog3Holder .cog-spin { animation-duration: var(--cog3-spin); }

    /* ---------------- ui body ---------------- */
    .ui-body {
        flex: 0 0 auto;
        position: relative;
        z-index: 40;
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
        padding: 6px 18px 14px;
    }

    .tray-label {
        margin: 0 0 4px 2px;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
    }

    .tray {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        padding: 9px 10px;
        border-radius: 16px;
        background: rgba(255,255,255,0.035);
        border: 1px solid var(--line);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .tray-item {
        width: 48px;
        height: 48px;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 13px;
        cursor: pointer;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.10);
        box-shadow: 0 6px 14px -6px rgba(0,0,0,0.7);
        transition: transform 0.12s ease, background 0.12s,
                    border-color 0.12s, box-shadow 0.12s;
    }

    .tray-item img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
    .tray-item:hover { background: rgba(255,255,255,0.09); transform: translateY(-2px); }
    .tray-item:active { transform: translateY(1px) scale(0.96); }

    .tray-item.selected {
        border-color: var(--gold);
        background: rgba(240,180,41,0.14);
        box-shadow:
            0 0 0 2px rgba(240,180,41,0.35),
            0 10px 22px -8px rgba(240,180,41,0.6);
        transform: translateY(-3px);
    }

    .tray-item.used {
        opacity: 0.20;
        filter: grayscale(1);
        pointer-events: none;
        transform: scale(0.94);
    }

    .action-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }

    .btn {
        flex: 1;
        padding: 11px 12px;
        border-radius: 13px;
        font-family: inherit;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        color: #dfe5f2;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.10);
        box-shadow: 0 8px 18px -12px rgba(0,0,0,0.9);
        transition: transform 0.08s, background 0.15s,
                    box-shadow 0.15s, border-color 0.15s;
    }

    .btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.18); }
    .btn:active { transform: translateY(2px); box-shadow: none; }

    .btn-primary {
        color: #261a04;
        border-color: rgba(255,255,255,0.35);
        background: linear-gradient(180deg, var(--gold-hi), var(--gold-lo));
        box-shadow:
            0 10px 24px -10px rgba(240,180,41,0.85),
            inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .btn-primary:hover { background: linear-gradient(180deg, #ffd97a, #e2a623); }

    .message {
        margin-top: 6px;
        min-height: 1rem;
        text-align: center;
        font-size: 0.74rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
        transition: color 0.2s;
    }

    .message.ok  { color: var(--green); }
    .message.err { color: var(--red);   }

    /* ---------------- drawer ---------------- */
    .drawer {
        position: relative;
        z-index: 50;
        margin-top: var(--drawer-top);
        text-align: center;
        transform: translateX(var(--drawer-shift-x));
        pointer-events: auto;
    }

    .drawer-img {
        display: block;
        margin: 0 auto;
        max-width: 100%;
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: auto;
    }

    #drawerClose {
        width: calc(100% * var(--drawer-close-scale));
        cursor: pointer;
    }

    #drawerOpen {
        width: calc(100% * var(--drawer-open-scale));
        transform: translate(var(--drawer-open-shift-x), var(--drawer-open-top));
        cursor: pointer;
    }

    .drawer .drawer-open  { display: none; }
    .drawer .drawer-close { display: block; }

    .drawer.is-open .drawer-close { display: none; }
    .drawer.is-open .drawer-open  { display: block; }

    /* ---------------- responsive ---------------- */
    @media (max-width: 420px) {
        .ui-header { padding: 10px 14px 4px; }
        h1 { font-size: 1.15rem; letter-spacing: 0.14em; }
        .sub { font-size: 0.64rem; }
        .weight-badge { width: 34px; height: 34px; }
        .tray-item { width: 42px; height: 42px; padding: 5px; border-radius: 11px; }
        .tray { gap: 6px; padding: 8px 8px; }
        .btn { font-size: 0.7rem; padding: 10px 8px; letter-spacing: 0.09em; }
        .ui-body { padding: 4px 12px 10px; }
    }

    @media (max-width: 360px) {
        h1 { font-size: 1rem; }
        .sub { font-size: 0.6rem; }
        .weight-badge { width: 28px; height: 28px; }
        .tray-item { width: 38px; height: 38px; padding: 4px; }
        .tray { gap: 5px; padding: 7px 7px; }
    }

    /* short viewports — shrink everything */
    @media (max-height: 640px) {
        :root { --cog-stage-height: 50px; }
        .ui-header { padding: 8px 14px 2px; }
        h1 { font-size: 1.1rem; }
        .tray-item { width: 40px; height: 40px; padding: 5px; }
        .weight-badge { width: 32px; height: 32px; }
        .btn { padding: 9px 10px; font-size: 0.7rem; }
    }
</style>
</head>
<body>
<div class="game-container">

    <header class="ui-header">
        <h1>
            <span>⚖️ REAL </span><span class="balance-word">BALANCE</span>
        </h1>
        <p class="sub">tap a weight, then a pan &middot; tap a dial on the column to set the code</p>
    </header>

    <section class="scale-section" id="scaleSection">
        <div class="scale-holder" id="scaleHolder">

            <div id="columnPart" class="part"></div>
            <div id="dialLayer"></div>
            <div id="beamPart" class="part"></div>

            <div class="pan-string" id="leftPan">
                <div class="weights-container">
                    <div class="top-row"    id="leftTopRow"></div>
                    <div class="bottom-row" id="leftBottomRow"></div>
                </div>
            </div>

            <div class="pan-string" id="rightPan">
                <div class="weights-container">
                    <div class="top-row"    id="rightTopRow"></div>
                    <div class="bottom-row" id="rightBottomRow"></div>
                </div>
            </div>

        </div>
    </section>

    <section class="cog-stage" id="cogStage">
        <div class="cog-holder" id="cogBackHolder">
            <img src="assets/cogback.png" alt="">
        </div>
        <div class="cog-holder" id="cog1Holder">
            <img src="assets/cog1.png" alt="" class="cog-spin">
        </div>
        <div class="cog-holder" id="cog2Holder">
            <img src="assets/cog2.png" alt="" class="cog-spin">
        </div>
        <div class="cog-holder" id="cog3Holder">
            <img src="assets/cog3.png" alt="" class="cog-spin">
        </div>
    </section>

    <div class="ui-body">
        <div class="tray-label">Weights</div>
        <div class="tray" id="tray">
            <div class="tray-item" data-type="2"><img src="assets/2weight.png" alt="2"></div>
            <div class="tray-item" data-type="5"><img src="assets/5weight.png" alt="5"></div>
            <div class="tray-item" data-type="star"><img src="assets/star.png" alt="star"></div>
            <div class="tray-item" data-type="triangle"><img src="assets/triangle.png" alt="triangle"></div>
            <div class="tray-item" data-type="circle"><img src="assets/ball.png" alt="circle"></div>
        </div>

        <div class="action-row">
            <button class="btn" id="resetBtn">Reset</button>
            <button class="btn btn-primary" id="checkBtn">Check</button>
        </div>

        <div class="message" id="messageDisplay"></div>

        <div class="drawer" id="drawer">
            <img src="assets/drawclose.png"
                 alt="open drawer"
                 class="drawer-img drawer-close"
                 id="drawerClose">
            <img src="assets/drawopen.png"
                 alt="drawer open"
                 class="drawer-img drawer-open"
                 id="drawerOpen">
        </div>
    </div>
</div>

<script>
(function () {
    "use strict";

    const OFFSETS = {
        column:   { x: 0, y: 0, scale: 1 },
        beam:     { x: 0, y: 0, scale: 1 },
        leftPan:  { x: 0, y: 0, scale: 1 },
        rightPan: { x: 0, y: 0, scale: 1 }
    };

    const CONFIG = {
        columnWidth:  100,
        columnHeight: 260,
        colTop:       0,
        beamWidth:    320,
        beamHeight:   80,
        panWidth:     130,
        panHeight:    160,
        containerWidth:  380,
        containerHeight: 320,
        pivotY: 50,
        pivotX: 190
    };

    const DIALS = [
        { x: 22, y: 75.5, size: 10, value: 0 },
        { x: 50, y: 68,   size: 13, value: 0 },
        { x: 78, y: 75.5, size: 10, value: 0 }
    ];

    const SECRET = { star: 2, triangle: 4, circle: 6 };

    const scaleSection  = document.getElementById('scaleSection');
    const beamEl        = document.getElementById('beamPart');
    const columnEl      = document.getElementById('columnPart');
    const dialLayer     = document.getElementById('dialLayer');
    const leftPan       = document.getElementById('leftPan');
    const rightPan      = document.getElementById('rightPan');
    const leftTopRow    = document.getElementById('leftTopRow');
    const leftBottomRow = document.getElementById('leftBottomRow');
    const rightTopRow   = document.getElementById('rightTopRow');
    const rightBottomRow= document.getElementById('rightBottomRow');
    const trayItems     = document.querySelectorAll('.tray-item');
    const resetBtn      = document.getElementById('resetBtn');
    const checkBtn      = document.getElementById('checkBtn');
    const msgEl         = document.getElementById('messageDisplay');

    const drawer        = document.getElementById('drawer');
    const drawerClose   = document.getElementById('drawerClose');
    const drawerOpen    = document.getElementById('drawerOpen');

    let leftSet      = new Set();
    let rightSet     = new Set();
    let selectedType = null;

    const dialEls  = [];
    const dialNums = [];

    let columnAspect = 100 / 260;
    let msgTimer     = null;

    function getImagePath(type) {
        return {
            '2':        'assets/2weight.png',
            '5':        'assets/5weight.png',
            'star':     'assets/star.png',
            'triangle': 'assets/triangle.png',
            'circle':   'assets/ball.png'
        }[type] || '';
    }

    function getValue(type) {
        if (type === '2') return 2;
        if (type === '5') return 5;
        if (type === 'star')     return SECRET.star;
        if (type === 'triangle') return SECRET.triangle;
        if (type === 'circle')   return SECRET.circle;
        return 0;
    }

    function getChar(type) {
        return { '2': '2', '5': '5', star: '⭐', triangle: '🔺', circle: '⚫' }[type] || '?';
    }

    function splitPyramid(set) {
        const arr = Array.from(set);
        const n = arr.length;
        if (n <= 2) return { bottom: arr, top: [] };
        if (n <= 4) return { bottom: arr.slice(0, 2), top: arr.slice(2) };
        return { bottom: arr.slice(0, 3), top: arr.slice(3) };
    }

    function computeTotals() {
        let l = 0, r = 0;
        for (const t of leftSet)  l += getValue(t);
        for (const t of rightSet) r += getValue(t);
        return { l, r };
    }

    function setMsg(text, kind, autoClearMs) {
        clearTimeout(msgTimer);
        msgEl.textContent = text;
        msgEl.className = 'message' + (kind ? ' ' + kind : '');
        if (autoClearMs) {
            msgTimer = setTimeout(function () {
                if (msgEl.textContent === text) {
                    msgEl.textContent = '';
                    msgEl.className = 'message';
                }
            }, autoClearMs);
        }
    }

    /* ================================================================
       COLUMN FITTING — the section is now flex, so read its size
       instead of writing it. The column fills the section height
       (with a small margin for the pans).
       ================================================================ */
    function fitColumn() {
        const stageW = scaleSection.clientWidth;
        const stageH = scaleSection.clientHeight;
        if (!stageW || !stageH) return;

        const ar = columnAspect;

        // Start by filling the width
        const maxColW = Math.min(stageW, 760);
        let w = maxColW;
        let h = w / ar;

        // Cap by the actual section height (minus a small buffer for pans)
        const maxH = stageH - 8;
        if (h > maxH) {
            h = maxH;
            w = h * ar;
        }

        CONFIG.columnWidth  = w;
        CONFIG.columnHeight = h;
        CONFIG.colTop       = 0;
        CONFIG.pivotY       = CONFIG.colTop + h * 0.155;

        const beamW = Math.min(stageW - 24, Math.max(180, w * 1.45));
        CONFIG.beamWidth  = beamW;
        CONFIG.beamHeight = beamW * 0.25;

        CONFIG.containerWidth  = stageW;
        CONFIG.containerHeight = stageH;
        CONFIG.pivotX          = stageW / 2;
    }

    function buildDials() {
        dialLayer.innerHTML = '';
        dialEls.length  = 0;
        dialNums.length = 0;

        DIALS.forEach(function (dial, i) {
            const el = document.createElement('button');
            el.type = 'button';
            el.className = 'dial';

            const num = document.createElement('span');
            num.textContent = dial.value;
            el.appendChild(num);

            el.addEventListener('click', function (e) {
                e.stopPropagation(); e.preventDefault();
                stepDial(i, 1);
            });

            el.addEventListener('contextmenu', function (e) {
                e.preventDefault(); e.stopPropagation();
                stepDial(i, -1);
            });

            el.addEventListener('wheel', function (e) {
                e.preventDefault();
                stepDial(i, e.deltaY < 0 ? 1 : -1);
            }, { passive: false });

            el.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
                    e.preventDefault(); stepDial(i, 1);
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
                    e.preventDefault(); stepDial(i, -1);
                }
            });

            el.addEventListener('animationend', function () { el.classList.remove('pop'); });

            dialLayer.appendChild(el);
            dialEls.push(el);
            dialNums.push(num);
        });

        updateDialLabels();
    }

    function layoutDials(colW, colH) {
        dialEls.forEach(function (el, i) {
            const d = DIALS[i];
            const sizePx = colW * d.size / 100;
            el.style.width  = sizePx + 'px';
            el.style.height = sizePx + 'px';
            el.style.left   = (colW * d.x / 100) + 'px';
            el.style.top    = (colH * d.y / 100) + 'px';
            el.style.fontSize = Math.max(9, Math.round(sizePx * 0.62)) + 'px';
        });
    }

    function stepDial(i, delta) {
        const d = DIALS[i];
        d.value = (d.value + delta + 10) % 10;
        dialNums[i].textContent = d.value;

        const el = dialEls[i];
        el.classList.remove('pop');
        void el.offsetWidth;
        el.classList.add('pop');

        dialEls.forEach(function (x) { x.classList.remove('solved'); });
        updateDialLabels();
    }

    function updateDialLabels() {
        const names = ['star', 'triangle', 'circle'];
        dialEls.forEach(function (el, i) {
            el.setAttribute('aria-label', names[i] + ' dial, value ' + DIALS[i].value);
        });
    }

    function renderWeights() {
        leftBottomRow.innerHTML  = '';
        leftTopRow.innerHTML     = '';
        rightBottomRow.innerHTML = '';
        rightTopRow.innerHTML    = '';

        const l = splitPyramid(leftSet);
        l.bottom.forEach(function (t) { leftBottomRow.appendChild(makeBadge(t, 'left')); });
        l.top.forEach(function (t)    { leftTopRow.appendChild(makeBadge(t, 'left')); });

        const r = splitPyramid(rightSet);
        r.bottom.forEach(function (t) { rightBottomRow.appendChild(makeBadge(t, 'right')); });
        r.top.forEach(function (t)    { rightTopRow.appendChild(makeBadge(t, 'right')); });
    }

    function makeBadge(type, side) {
        const b = document.createElement('span');
        b.className = 'weight-badge';

        const img = document.createElement('img');
        img.src = getImagePath(type);
        img.alt = getChar(type);
        b.appendChild(img);

        b.addEventListener('click', function (e) {
            e.stopPropagation();
            if (selectedType !== null) addToSide(side);
            else                       removeWeight(side, type);
        });

        return b;
    }

    function removeWeight(side, type) {
        if (side === 'left') leftSet.delete(type);
        else                 rightSet.delete(type);
        if (selectedType === type) selectedType = null;
        renderAll();
    }

    function updatePositions(angle) {
        const column = OFFSETS.column;
        const beam   = OFFSETS.beam;
        const lpo    = OFFSETS.leftPan;
        const rpo    = OFFSETS.rightPan;
        const { containerWidth, containerHeight } = CONFIG;

        const colW = CONFIG.columnWidth  * column.scale;
        const colH = CONFIG.columnHeight * column.scale;
        const colTopPx = CONFIG.colTop + column.y;
        const colLeftCss = 'calc(50% - ' + (colW / 2) + 'px + ' + column.x + 'px)';

        columnEl.style.width  = colW + 'px';
        columnEl.style.height = colH + 'px';
        columnEl.style.left   = colLeftCss;
        columnEl.style.top    = colTopPx + 'px';

        dialLayer.style.width  = colW + 'px';
        dialLayer.style.height = colH + 'px';
        dialLayer.style.left   = colLeftCss;
        dialLayer.style.top    = colTopPx + 'px';
        layoutDials(colW, colH);

        const beamW = CONFIG.beamWidth  * beam.scale;
        const beamH = CONFIG.beamHeight * beam.scale;
        const halfW = beamW / 2;
        const pivotX = containerWidth / 2;

        beamEl.style.width  = beamW + 'px';
        beamEl.style.height = beamH + 'px';
        beamEl.style.left   = (pivotX - halfW + beam.x) + 'px';
        beamEl.style.top    = (CONFIG.pivotY - beamH / 2 + beam.y) + 'px';
        beamEl.style.transformOrigin = halfW + 'px ' + (beamH / 2) + 'px';
        beamEl.style.transform = 'rotate(' + angle + 'deg)';

        const rad = angle * Math.PI / 180;
        const cos = Math.cos(rad);
        const sin = Math.sin(rad);
        const beamCX = pivotX + beam.x;
        const beamCY = CONFIG.pivotY + beam.y;

        const leftEndX  = beamCX - halfW * cos;
        const leftEndY  = beamCY - halfW * sin;
        const rightEndX = beamCX + halfW * cos;
        const rightEndY = beamCY + halfW * sin;

        const stringLen = 50;
        const panScale = Math.min(1, colW / 130);

        const panW = CONFIG.panWidth  * lpo.scale * panScale;
        const panH = CONFIG.panHeight * lpo.scale * panScale;
        let lx = leftEndX + lpo.x;
        let ly = leftEndY + stringLen + lpo.y;
        lx = Math.max(panW / 2, Math.min(containerWidth  - panW / 2, lx));
        ly = Math.max(panH / 2, Math.min(containerHeight - panH / 2, ly));
        leftPan.style.width  = panW + 'px';
        leftPan.style.height = panH + 'px';
        leftPan.style.left   = (lx - panW / 2) + 'px';
        leftPan.style.top    = (ly - panH / 2) + 'px';

        const panWR = CONFIG.panWidth  * rpo.scale * panScale;
        const panHR = CONFIG.panHeight * rpo.scale * panScale;
        let rx = rightEndX + rpo.x;
        let ry = rightEndY + stringLen + rpo.y;
        rx = Math.max(panWR / 2, Math.min(containerWidth  - panWR / 2, rx));
        ry = Math.max(panHR / 2, Math.min(containerHeight - panHR / 2, ry));
        rightPan.style.width  = panWR + 'px';
        rightPan.style.height = panHR + 'px';
        rightPan.style.left   = (rx - panWR / 2) + 'px';
        rightPan.style.top    = (ry - panHR / 2) + 'px';
    }

    function renderAll() {
        renderWeights();

        const { l, r } = computeTotals();
        const diff  = l - r;
        const angle = Math.min(18, Math.max(-18, -diff * 0.8));
        updatePositions(angle);

        trayItems.forEach(function (item) {
            const t = item.dataset.type;
            item.classList.toggle('used', leftSet.has(t) || rightSet.has(t));
            item.classList.toggle('selected',
                t === selectedType && !leftSet.has(t) && !rightSet.has(t));
        });
    }

    function addToSide(side) {
        if (!selectedType) {
            setMsg('Pick a weight from the tray first', 'err', 900);
            return;
        }
        if (leftSet.has(selectedType) || rightSet.has(selectedType)) {
            setMsg('That weight is already on the scale', 'err', 1000);
            return;
        }

        if (side === 'left') leftSet.add(selectedType);
        else                 rightSet.add(selectedType);

        selectedType = null;
        renderAll();

        const pan = (side === 'left') ? leftPan : rightPan;
        pan.classList.add('bounce');
        setTimeout(function () { pan.classList.remove('bounce'); }, 200);

        setMsg('');
    }

    function resetAll() {
        leftSet.clear();
        rightSet.clear();
        selectedType = null;

        DIALS.forEach(function (d, i) {
            d.value = 0;
            dialNums[i].textContent = '0';
            dialEls[i].classList.remove('solved', 'pop');
        });
        updateDialLabels();

        renderAll();
        setMsg('');
    }

    trayItems.forEach(function (item) {
        item.addEventListener('click', function () {
            const t = item.dataset.type;

            if (leftSet.has(t) || rightSet.has(t)) {
                setMsg('That weight is already on the scale', 'err', 900);
                return;
            }

            selectedType = (selectedType === t) ? null : t;
            renderAll();

            if (selectedType) setMsg('Selected ' + getChar(selectedType) + ' — now tap a pan', null, 1100);
            else              setMsg('', null, 0);
        });
    });

    leftPan.addEventListener('click',  function () { addToSide('left');  });
    rightPan.addEventListener('click', function () { addToSide('right'); });
    resetBtn.addEventListener('click', resetAll);

    checkBtn.addEventListener('click', function () {
        const s = DIALS[0].value;
        const t = DIALS[1].value;
        const c = DIALS[2].value;

        if (s === SECRET.star && t === SECRET.triangle && c === SECRET.circle) {
            setMsg('✅ Solved — the code is right!', 'ok');
            dialEls.forEach(function (el) { el.classList.add('solved'); });
        } else {
            setMsg('❌ Not quite — keep testing the pans.', 'err', 1800);
            dialEls.forEach(function (el) { el.classList.remove('solved'); });
        }
    });

    drawerClose.addEventListener('click', function (e) {
        e.stopPropagation();
        drawer.classList.add('is-open');
    });

    drawerOpen.addEventListener('click', function (e) {
        e.stopPropagation();
        drawer.classList.remove('is-open');
    });

    function init() {
        fitColumn();
        renderAll();
    }

    (function preloadColumn() {
        const img = new Image();
        img.onload = function () {
            if (img.naturalWidth && img.naturalHeight) {
                columnAspect = img.naturalWidth / img.naturalHeight;
            }
            init();
        };
        img.onerror = function () { init(); };
        img.src = 'assets/column.png';
    })();

    buildDials();

    window.addEventListener('load', init);
    window.addEventListener('resize', init);
    setTimeout(init, 100);
})();
</script>
</body>
  </html>
